name: Propose skill snapshot updates

on:
  schedule:
    - cron: '23 9 1 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-updates
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Propose matching catalog revisions and snapshots
        run: node scripts/sync-skills.mjs --update
      - name: Verify snapshot integrity offline
        run: node scripts/sync-skills.mjs --check
      - uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676
        with:
          token: ${{ github.token }}
          branch: automation/catalog-updates
          delete-branch: false
          add-paths: |
            catalog.json
            skills/vendor/
          title: 'Propose approved skill snapshot updates'
          commit-message: 'chore: update approved skill snapshots'
          body: |
            This pull request proposes public upstream revisions and matching skill snapshots.

            Review catalog.json, skills/vendor/_manifest.json, and each changed skill with its license and PROVENANCE.json.
            Upstream content is copied as data and is not executed by this workflow.
            This workflow does not merge changes or install skills into consumer projects.
